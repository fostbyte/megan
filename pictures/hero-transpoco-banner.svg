<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background atmospheric gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14212e" />
      <stop offset="35%" stop-color="#243b4d" />
      <stop offset="65%" stop-color="#3d5668" />
      <stop offset="100%" stop-color="#182329" />
    </linearGradient>

    <!-- Mountain silhouettes -->
    <linearGradient id="mountainFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c4456" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1b2934" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="mountainMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f3442" />
      <stop offset="100%" stop-color="#111f27" />
    </linearGradient>

    <!-- Glowing streamline gradients (Transpoco signature) -->
    <linearGradient id="streamlineGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#82f2a7" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#82f2a7" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="streamlineCyan" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#82f2a7" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05" />
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Sky & Atmosphere -->
  <rect width="1920" height="1080" fill="url(#skyGrad)" />

  <!-- Far Mountains -->
  <polygon points="0,520 280,310 520,440 850,220 1180,380 1480,260 1780,410 1920,330 1920,800 0,800" fill="url(#mountainFar)" />

  <!-- Mid Mountains -->
  <polygon points="0,620 220,450 480,560 760,390 1040,510 1340,360 1680,490 1920,420 1920,950 0,950" fill="url(#mountainMid)" />

  <!-- Road & Valley -->
  <path d="M 0 880 C 450 820, 850 780, 1200 770 C 1550 760, 1750 840, 1920 890 L 1920 1080 L 0 1080 Z" fill="#0d171c" />
  <path d="M 300 1080 L 800 780 L 980 780 L 1600 1080 Z" fill="#172228" />

  <!-- Transpoco White Logistics Fleet Vehicle (Isometric Rear 3/4) -->
  <g transform="translate(1000, 360)">
    <!-- Vehicle Shadow -->
    <ellipse cx="280" cy="460" rx="260" ry="40" fill="#050a0d" opacity="0.7" />

    <!-- Vehicle Main Body -->
    <path d="M 120 140 L 410 120 L 460 380 L 430 430 L 100 440 L 80 200 Z" fill="#e2e8f0" />
    <!-- Rear Doors -->
    <path d="M 140 160 L 400 140 L 420 410 L 120 420 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2" />
    <!-- Door Divider -->
    <line x1="270" y1="150" x2="270" y2="415" stroke="#64748b" stroke-width="3" />
    <!-- Door Handles -->
    <rect x="250" y="270" width="12" height="24" rx="4" fill="#334155" />
    <rect x="278" y="270" width="12" height="24" rx="4" fill="#334155" />
    <!-- Tail Lights -->
    <rect x="100" y="320" width="16" height="55" rx="4" fill="#ef4444" />
    <rect x="420" y="310" width="16" height="55" rx="4" fill="#ef4444" />
    <!-- Bumper -->
    <rect x="90" y="420" width="350" height="25" rx="6" fill="#334155" />
    <!-- Wheels -->
    <ellipse cx="140" cy="445" rx="35" ry="25" fill="#0f172a" />
    <ellipse cx="400" cy="435" rx="35" ry="25" fill="#0f172a" />
  </g>

  <!-- Transpoco Signature Swooping Streamlines (Green & Cyan) -->
  <g filter="url(#softGlow)">
    <!-- Streamline 1 -->
    <path d="M 650 320 C 1050 180, 1550 140, 1720 380 C 1820 520, 1680 720, 1380 720 C 1080 720, 920 580, 960 480 C 1000 380, 1220 320, 1420 360" 
          fill="none" stroke="url(#streamlineGreen)" stroke-width="7" stroke-linecap="round" />

    <!-- Streamline 2 -->
    <path d="M 680 340 C 1080 200, 1560 170, 1700 410 C 1800 560, 1640 740, 1340 735 C 1050 730, 940 595, 980 500 C 1020 400, 1240 340, 1450 380" 
          fill="none" stroke="url(#streamlineCyan)" stroke-width="5" stroke-linecap="round" />

    <!-- Streamline 3 -->
    <path d="M 620 310 C 1020 170, 1530 120, 1740 360 C 1850 500, 1710 700, 1410 710" 
          fill="none" stroke="#82f2a7" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Ambient Dark Overlay for Typography Contrast -->
  <rect width="1920" height="1080" fill="#071219" opacity="0.45" />
  <linearGradient id="heroVignette" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#08141d" stop-opacity="0.6" />
    <stop offset="60%" stop-color="#08141d" stop-opacity="0.2" />
    <stop offset="100%" stop-color="#08141d" stop-opacity="0.95" />
  </linearGradient>
  <rect width="1920" height="1080" fill="url(#heroVignette)" />
</svg>
