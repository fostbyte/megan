<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="usfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022d20" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="usfGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="24" fill="url(#usfBg)" />
  
  <!-- Subtle academic crest / university pillars -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="2">
    <line x1="260" y1="160" x2="260" y2="280" />
    <line x1="350" y1="160" x2="350" y2="280" />
    <line x1="440" y1="160" x2="440" y2="280" />
    <line x1="530" y1="160" x2="530" y2="280" />
    <polygon points="400,100 220,160 580,160" fill="none" />
    <line x1="200" y1="280" x2="600" y2="280" />
  </g>

  <!-- Central Graphic: Graduation Cap & Laurel -->
  <g transform="translate(330, 80)">
    <!-- Mortarboard cap -->
    <polygon points="70,30 140,55 70,80 0,55" fill="#042f2e" stroke="url(#usfGold)" stroke-width="3" />
    <path d="M 30 65 L 30 95 C 30 115 110 115 110 95 L 110 65" fill="#042f2e" stroke="url(#usfGold)" stroke-width="3" />
    <!-- Tassel -->
    <path d="M 125 60 C 135 75 140 95 138 115" fill="none" stroke="#fbbf24" stroke-width="2.5" />
    <circle cx="138" cy="118" r="4" fill="#fbbf24" />
  </g>

  <!-- Metrics -->
  <g transform="translate(160, 270)">
    <rect width="480" height="42" rx="10" fill="#022d20" fill-opacity="0.85" stroke="#059669" stroke-width="1" />
    <text x="240" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#34d399" text-anchor="middle">
      USF • Bachelor of Supply Chain Management (Est. 2028)
    </text>
  </g>

  <!-- Label -->
  <g transform="translate(120, 335)">
    <rect width="560" height="65" rx="12" fill="#022d20" fill-opacity="0.9" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="280" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="1">
      USF CAMPUS &amp; EDUCATION PHOTO PLACEHOLDER
    </text>
    <text x="280" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">
      Swap with USF campus or academic photo in pictures/usf-campus.svg
    </text>
  </g>
</svg>
