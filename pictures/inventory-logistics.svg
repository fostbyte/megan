<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="invBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091e2f" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="invAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="24" fill="url(#invBg)" />
  
  <!-- Subtle warehouse grid lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.5">
    <path d="M 100 350 L 250 150 L 550 150 L 700 350 Z" fill="none" />
    <line x1="250" y1="150" x2="250" y2="350" />
    <line x1="400" y1="150" x2="400" y2="350" />
    <line x1="550" y1="150" x2="550" y2="350" />
  </g>

  <!-- Central Graphic: Inventory, Barcode & FIFO Rotation -->
  <g transform="translate(320, 90)">
    <!-- Shield / clipboard outline -->
    <rect x="20" y="20" width="120" height="130" rx="14" fill="#1e293b" stroke="url(#invAccent)" stroke-width="3" />
    <!-- Barcode lines -->
    <line x1="40" y1="50" x2="40" y2="90" stroke="#38bdf8" stroke-width="4" />
    <line x1="50" y1="50" x2="50" y2="90" stroke="#38bdf8" stroke-width="2" />
    <line x1="58" y1="50" x2="58" y2="90" stroke="#38bdf8" stroke-width="5" />
    <line x1="70" y1="50" x2="70" y2="90" stroke="#38bdf8" stroke-width="3" />
    <line x1="80" y1="50" x2="80" y2="90" stroke="#38bdf8" stroke-width="6" />
    <line x1="94" y1="50" x2="94" y2="90" stroke="#38bdf8" stroke-width="2" />
    <line x1="102" y1="50" x2="102" y2="90" stroke="#38bdf8" stroke-width="4" />
    <line x1="112" y1="50" x2="112" y2="90" stroke="#38bdf8" stroke-width="3" />
    <line x1="120" y1="50" x2="120" y2="90" stroke="#38bdf8" stroke-width="5" />
    <!-- Checkmark badge -->
    <circle cx="80" cy="115" r="14" fill="#10b981" />
    <path d="M 74 115 L 78 119 L 87 110" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Tags -->
  <g transform="translate(160, 270)">
    <rect width="480" height="42" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <text x="240" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle">
      FIFO Rotation • 100% Health Code Compliance • POS Sales Audit
    </text>
  </g>

  <!-- Placeholder label -->
  <g transform="translate(120, 335)">
    <rect width="560" height="65" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="280" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">
      INVENTORY CONTROL PHOTO PLACEHOLDER
    </text>
    <text x="280" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">
      Swap with inventory or operations photos in pictures/inventory-logistics.svg
    </text>
  </g>
</svg>
