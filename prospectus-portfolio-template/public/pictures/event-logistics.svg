<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="eventBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <linearGradient id="eventGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="24" fill="url(#eventBg)" />
  
  <!-- Subtle floor plan arcs -->
  <g opacity="0.1" stroke="#fbbf24" stroke-width="1.5">
    <circle cx="200" cy="200" r="120" fill="none" stroke-dasharray="6,6" />
    <circle cx="600" cy="200" r="120" fill="none" stroke-dasharray="6,6" />
    <rect x="340" y="80" width="120" height="180" rx="12" fill="none" />
  </g>

  <!-- Central Graphic: Staging & Coordination -->
  <g transform="translate(330, 85)">
    <!-- Stage / Podium shape -->
    <path d="M 40 40 L 100 40 L 130 110 L 10 110 Z" fill="#3f3f46" stroke="url(#eventGold)" stroke-width="2.5" />
    <!-- Clock / Timeline icon for tight service timelines -->
    <circle cx="70" cy="135" r="22" fill="#18181b" stroke="#f59e0b" stroke-width="2.5" />
    <polyline points="70,123 70,135 78,138" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Metrics -->
  <g transform="translate(170, 270)">
    <rect width="460" height="42" rx="10" fill="#18181b" fill-opacity="0.85" stroke="#3f3f46" stroke-width="1" />
    <text x="230" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#fbbf24" text-anchor="middle">
      500+ Guest Galas • Material Flow Staging • Zero Supply Bottlenecks
    </text>
  </g>

  <!-- Label -->
  <g transform="translate(120, 335)">
    <rect width="560" height="65" rx="12" fill="#18181b" fill-opacity="0.9" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="280" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="1">
      EVENT LOGISTICS PHOTO PLACEHOLDER
    </text>
    <text x="280" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#a1a1aa" text-anchor="middle">
      Swap with banquet, staging, or hospitality photos in pictures/event-logistics.svg
    </text>
  </g>
</svg>
