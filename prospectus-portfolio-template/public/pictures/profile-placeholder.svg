<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="32" fill="url(#bgGrad)" />
  
  <!-- Subtle decorative grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="500" y1="0" x2="500" y2="600" />
    <line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="400" x2="600" y2="400" />
    <line x1="0" y1="500" x2="600" y2="500" />
  </g>

  <!-- Glowing background orb -->
  <circle cx="300" cy="250" r="140" fill="#10b981" opacity="0.15" filter="url(#glow)" />

  <!-- Avatar Silhouette -->
  <!-- Head -->
  <circle cx="300" cy="220" r="75" fill="#334155" stroke="url(#avatarGrad)" stroke-width="4" />
  <!-- Shoulders / Torso -->
  <path d="M 180 430 C 180 340, 230 310, 300 310 C 370 310, 420 340, 420 430 Z" fill="#334155" stroke="url(#avatarGrad)" stroke-width="4" />

  <!-- Camera / Swap Photo Badge -->
  <g transform="translate(370, 320)">
    <circle cx="28" cy="28" r="28" fill="url(#badgeGrad)" />
    <!-- Camera Icon -->
    <path d="M 18 22 L 21 17 L 35 17 L 38 22 L 44 22 C 45.1 22 46 22.9 46 24 L 46 38 C 46 39.1 45.1 40 44 40 L 12 40 C 10.9 40 10 39.1 10 38 L 10 24 C 10 22.9 10.9 22 12 22 Z" fill="#ffffff" />
    <circle cx="28" cy="31" r="6" fill="#0f172a" />
  </g>

  <!-- Explanatory Label Card -->
  <g transform="translate(70, 470)">
    <rect width="460" height="90" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <text x="230" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="1.5">
      PHOTO PLACEHOLDER
    </text>
    <text x="230" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">
      Swap with Megan's photo in pictures/profile-placeholder.svg
    </text>
  </g>
</svg>
