<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="boutiqueBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="accentRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="24" fill="url(#boutiqueBg)" />
  
  <!-- Subtle pattern -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1.5">
    <circle cx="150" cy="120" r="80" />
    <circle cx="680" cy="300" r="110" />
    <circle cx="400" cy="400" r="150" />
  </g>

  <!-- Central Graphic Illustration: Sourcing & Apparel Boutique -->
  <g transform="translate(340, 100)">
    <!-- Package / Shopping bag icon -->
    <rect x="0" y="30" width="120" height="110" rx="16" fill="#1e293b" stroke="url(#accentRose)" stroke-width="3" />
    <!-- Handle -->
    <path d="M 28 30 C 28 0, 92 0, 92 30" fill="none" stroke="url(#accentRose)" stroke-width="3" stroke-linecap="round" />
    <!-- Tag -->
    <circle cx="60" cy="85" r="18" fill="#8b5cf6" opacity="0.3" />
    <path d="M 52 85 L 68 85 M 60 77 L 60 93" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Supply Chain & Metrics badges -->
  <g transform="translate(180, 270)">
    <rect width="440" height="42" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="220" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f472b6" text-anchor="middle">
      200+ SKUs • Global Material Sourcing • $4.5K/mo Recurring Revenue
    </text>
  </g>

  <!-- Swap placeholder prompt -->
  <g transform="translate(120, 335)">
    <rect width="560" height="65" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="280" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ec4899" text-anchor="middle" letter-spacing="1">
      TEENY THEENYS BOUTIQUE PHOTO PLACEHOLDER
    </text>
    <text x="280" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">
      Swap with products, packaging, or brand photos in pictures/teeny-theenys-boutique.svg
    </text>
  </g>
</svg>
